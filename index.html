<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tracking Định Vị Real-time - Google Maps</title>
    
    <!-- Leaflet Bản đồ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #ea4335;
            --primary-hover: #d93025;
            --success: #34a853; 
            --bg-gradient: linear-gradient(135deg, #e8eaed 0%, #f8f9fa 100%);
            --glass-bg: rgba(255, 255, 255, 0.98);
            --text-main: #202124;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .app-container {
            background: var(--glass-bg);
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 1200px;
            padding: 24px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }

        .control-panel { display: flex; flex-direction: column; gap: 20px; }
        .brand h2 { font-size: 24px; font-weight: 700; color: #1a73e8; display: flex; align-items: center; gap: 12px; }
        
        .status-card {
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 16px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .radar-pulse {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 12px;
            height: 12px;
            background-color: #ea4335;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.7);
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(234, 67, 53, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
        }

        .status-title { font-weight: 700; margin-bottom: 6px; color: #5f6368; text-transform: uppercase; font-size: 11px; letter-spacing: 0.8px; }
        #status-text { font-size: 14px; line-height: 1.5; color: #3c4043; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 14px 20px;
            font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s ease-in-out; box-shadow: 0 2px 6px rgba(234, 67, 53, 0.3);
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-success { background: var(--success); box-shadow: 0 2px 6px rgba(52, 168, 83, 0.3); }
        .btn-success:hover { background: #2b8b42; }

        .share-box { display: none; background: #f8f9fa; padding: 16px; border-radius: 14px; border: 1px solid #dadce0; }
        .input-group { display: flex; background: #fff; border: 1px solid #dadce0; border-radius: 10px; padding: 4px; margin-top: 8px; }
        .input-group input { border: none; background: transparent; flex: 1; padding: 8px; font-size: 13px; outline: none; color: #3c4043; }
        .btn-copy { background: #1a73e8; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }

        #map-container { position: relative; height: 600px; border-radius: 18px; overflow: hidden; border: 1px solid #dadce0; }
        #map { height: 100%; width: 100%; }

        .leaflet-control-layers { border-radius: 8px !important; box-shadow: 0 2px 6px rgba(0,0,0,0.15) !important; font-size: 13px !important; padding: 8px !important; border: none !important; }
        
        /* ẨN TOÀN BỘ BẢNG CHỮ ĐIỀU HƯỚNG */
        .leaflet-routing-container { display: none !important; }

        /* Animation mượt cho icon mũi tên điều hướng */
        .nav-arrow-wrapper {
            transition: transform 0.3s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 36px;
            height: 36px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
        }

        footer { margin-top: auto; color: #5f6368; font-size: 13px; text-align: center; padding: 10px; }
        footer strong { color: #202124; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Panel điều khiển -->
        <div class="control-panel">
            <div class="brand">
                <h2><i class="fa-solid fa-satellite-dish"></i> GPS Tracking Live</h2>
            </div>

            <div class="status-card">
                <div class="radar-pulse" id="radar"></div>
                <div class="status-title">Hệ thống Tracking</div>
                <p id="status-text">Đang chờ kích hoạt tín hiệu vệ tinh...</p>
            </div>

            <button class="btn" id="btn-get" onclick="startLiveTracking()">
                <i class="fa-solid fa-location-crosshairs"></i> Bật chia sẻ vị trí trực tiếp
            </button>

            <button class="btn btn-success" id="btn-route" style="display: none;" onclick="startLiveRouting()">
                <i class="fa-solid fa-location-arrow"></i> Bắt đầu đi (Điều hướng)
            </button>

            <div class="share-box" id="shareBox">
                <div class="status-title">Gửi link này cho bạn bè:</div>
                <div class="input-group">
                    <input type="text" id="share-link" readonly>
                    <button class="btn-copy" onclick="copyLink()">Copy</button>
                </div>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <footer>
        Bản quyền mã nguồn &copy; 2026. Phát triển độc quyền bởi <strong>Minh Fansub PTL</strong>.
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script>
        let map;
        let baseLayers;
        let myMarker = null;
        let targetMarker = null;
        let routeControl = null;
        
        let targetLat = null;
        let targetLng = null;
        let trackingId = null; 

        // Hàm tạo Icon mũi tên chỉ đường (3D Arrow chuẩn Google Map) xoay theo góc
        function getNavArrowIcon(bearingDeg) {
            return L.divIcon({
                className: 'custom-nav-icon',
                html: `
                    <div class="nav-arrow-wrapper" style="transform: rotate(${bearingDeg}deg);">
                        <svg viewBox="0 0 24 24" width="36" height="36">
                            <path fill="#1a73e8" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" d="M12 2L2 22l10-4 10 4L12 2z"/>
                        </svg>
                    </div>
                `,
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            });
        }

        // Icon Custom tĩnh lúc đứng yên
        const liveIcon = L.divIcon({
            className: 'live-marker',
            html: '<div style="background-color: #1a73e8; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 8px rgba(0,0,0,0.5);"></div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
        });

        // Tính góc tọa độ (Bearing) từ vị trí người dùng hướng đến điểm đích
        function getBearing(startLat, startLng, destLat, destLng) {
            const toRad = Math.PI / 180;
            const toDeg = 180 / Math.PI;
            const dLng = (destLng - startLng) * toRad;
            const lat1 = startLat * toRad;
            const lat2 = destLat * toRad;
            const y = Math.sin(dLng) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
            let bearing = Math.atan2(y, x) * toDeg;
            return (bearing + 360) % 360;
        }

        // Khởi tạo bản đồ
        function initSystemMap(lat = 21.0285, lng = 105.8542, zoom = 6) {
            const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            });
            const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y,m&x={x}&y={y}&z={z}', {
                maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            });

            map = L.map('map', { center: [lat, lng], zoom: zoom, layers: [googleHybrid], zoomControl: false });
            L.control.zoom({ position: 'topright' }).addTo(map);

            baseLayers = { "Bản đồ Vệ tinh": googleHybrid, "Bản đồ Đường sá": googleStreets };
            L.control.layers(baseLayers, null, { position: 'topright', collapsed: false }).addTo(map);
        }

        // NGƯỜI GỬI: Chỉ lấy vị trí và bật link
        function startLiveTracking() {
            const status = document.getElementById('status-text');
            const radar = document.getElementById('radar');
            
            if (!navigator.geolocation) return status.innerText = "Trình duyệt không hỗ trợ GPS.";

            status.innerHTML = "<b>Đang khởi động radar quét thời gian thực...</b>";
            radar.style.display = 'block';

            trackingId = navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                
                status.innerHTML = `<b>Đang phát tín hiệu Live!</b><br>Tọa độ: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                
                if (myMarker) {
                    myMarker.setLatLng([lat, lng]);
                } else {
                    map.setView([lat, lng], 18);
                    myMarker = L.marker([lat, lng], {icon: liveIcon}).addTo(map);
                }

                const pureUrl = window.location.href.split('?')[0];
                document.getElementById('share-link').value = `${pureUrl}?lat=${lat}&lng=${lng}`;
                document.getElementById('shareBox').style.display = 'block';
                document.getElementById('btn-get').innerHTML = '<i class="fa-solid fa-satellite"></i> Đang theo dõi...';

            }, (err) => {
                status.innerText = "Lỗi GPS: " + err.message;
            }, { enableHighAccuracy: true, maximumAge: 0 });
        }

        // NGƯỜI NHẬN: Điều hướng chạy theo (Có mũi tên xoay & Đường chỉ xanh)
        function startLiveRouting() {
            const status = document.getElementById('status-text');
            document.getElementById('radar').style.display = 'block';

            status.innerHTML = "<b>Bắt đầu điều hướng... Hãy di chuyển!</b>";

            trackingId = navigator.geolocation.watchPosition((pos) => {
                const receiverLat = pos.coords.latitude;
                const receiverLng = pos.coords.longitude;
                const speed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : 0;
                
                // Tính toán góc xoay (Bearing) mũi tên chỉ tới mục tiêu
                const bearing = getBearing(receiverLat, receiverLng, targetLat, targetLng);

                status.innerHTML = `<b>Đang điều hướng!</b><br>Tốc độ: ${speed} km/h - Đang tiến tới mục tiêu.`;
                map.panTo([receiverLat, receiverLng]);

                // Xử lý tách biệt Marker để tránh lỗi giật nháy của Leaflet Routing
                if (!myMarker) {
                    // Lần đầu tạo mũi tên xoay
                    myMarker = L.marker([receiverLat, receiverLng], {
                        icon: getNavArrowIcon(bearing), 
                        zIndexOffset: 1000 // Mũi tên luôn nổi lên trên cùng
                    }).addTo(map);
                } else {
                    // Khi di chuyển: Cập nhật vị trí & Góc xoay mũi tên
                    myMarker.setLatLng([receiverLat, receiverLng]);
                    myMarker.setIcon(getNavArrowIcon(bearing));
                }

                // Vẽ ĐƯỜNG CHỈ XANH Y SÌ GOOGLE MAP
                if (!routeControl) {
                    routeControl = L.Routing.control({
                        waypoints: [
                            L.latLng(receiverLat, receiverLng),
                            L.latLng(targetLat, targetLng)
                        ],
                        show: false, // Ẩn bảng chữ
                        addWaypoints: false, // Chống lỗi người dùng click bấm thêm điểm
                        routeWhileDragging: false,
                        fitSelectedRoutes: true,
                        lineOptions: { 
                            styles: [
                                { color: '#ffffff', opacity: 1, weight: 8 },  // Viền trắng
                                { color: '#1a73e8', opacity: 1, weight: 5 }   // Lõi xanh lam
                            ] 
                        },
                        // TRICKS LỖI CHỐNG GIẬT: Vô hiệu hóa marker mặc định của routing machine
                        createMarker: function() { return null; }
                    }).addTo(map);
                } else {
                    // Update lại đường đi để đường ngắn lại
                    routeControl.setWaypoints([
                        L.latLng(receiverLat, receiverLng),
                        L.latLng(targetLat, targetLng)
                    ]);
                }

            }, (err) => {
                status.innerText = "Mất tín hiệu GPS.";
            }, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function copyLink() {
            const copyText = document.getElementById("share-link");
            copyText.select(); document.execCommand("copy");
            alert("Đã copy liên kết. Gửi ngay cho bạn bè!");
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const lat = parseFloat(urlParams.get('lat'));
            const lng = parseFloat(urlParams.get('lng'));

            if (!isNaN(lat) && !isNaN(lng)) {
                targetLat = lat; targetLng = lng;

                document.getElementById('btn-get').style.display = 'none';
                document.getElementById('btn-route').style.display = 'flex';
                document.getElementById('status-text').innerHTML = `<b>Xác nhận điểm hẹn từ bạn bè!</b><br>Bấm "Bắt đầu đi" để điều hướng.`;

                initSystemMap(targetLat, targetLng, 17);
                
                // Cắm cờ đỏ ở điểm đích
                targetMarker = L.marker([targetLat, targetLng]).addTo(map).bindPopup("<b>Bạn của bạn ở đây!</b>").openPopup();
            } else {
                initSystemMap();
            }
        }
    </script>
</body>
</html>
