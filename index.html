<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chia Sẻ Vị Trí & Định Tuyến Google Maps</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1a73e8; /* Màu xanh chuẩn Google */
            --primary-hover: #1557b0;
            --success: #34a853; /* Màu xanh lá chuẩn Google */
            --bg-gradient: linear-gradient(135deg, #f0f4f9 0%, #d2e3fc 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-main: #202124;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .app-container {
            background: var(--glass-bg);
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1200px;
            padding: 24px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }

        /* Panel điều khiển */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a73e8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-card {
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 16px;
            border-radius: 16px;
        }

        .status-title {
            font-weight: 700;
            margin-bottom: 6px;
            color: #5f6368;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.8px;
        }

        #status-text {
            font-size: 14px;
            line-height: 1.5;
            color: #3c4043;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.2);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            box-shadow: 0 2px 6px rgba(52, 168, 83, 0.2);
        }
        
        .btn-success:hover {
            background: #2b8b42;
        }

        .share-box {
            display: none;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #dadce0;
        }

        .input-group {
            display: flex;
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 10px;
            padding: 4px;
            margin-top: 8px;
        }

        .input-group input {
            border: none;
            background: transparent;
            flex: 1;
            padding: 8px;
            font-size: 13px;
            outline: none;
            color: #3c4043;
        }

        .btn-copy {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        /* Khung bản đồ */
        #map-container {
            position: relative;
            height: 600px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #dadce0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* Menu tùy chọn chọn lớp bản đồ của Google */
        .leaflet-control-layers {
            border-radius: 8px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15) !important;
            font-size: 13px !important;
            padding: 8px !important;
            border: none !important;
        }

        .leaflet-routing-container {
            background: rgba(255, 255, 255, 0.98) !important;
            padding: 12px !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
            max-height: 220px !important;
            overflow-y: auto !important;
            font-size: 13px !important;
            border: 1px solid #dadce0 !important;
        }

        footer {
            margin-top: auto;
            color: #5f6368;
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }
        footer strong {
            color: #202124;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="control-panel">
            <div class="brand">
                <h2><i class="fa-solid fa-map-location-dot"></i> MFS GPS Share</h2>
            </div>

            <div class="status-card">
                <div class="status-title">Hệ thống</div>
                <p id="status-text">Vui lòng kích hoạt định vị để nhận dữ liệu bản đồ chi tiết.</p>
            </div>

            <button class="btn" id="btn-get" onclick="getMyLocation()">
                <i class="fa-solid fa-location-crosshairs"></i> Lấy vị trí của tôi
            </button>

            <button class="btn btn-success" id="btn-route" style="display: none;" onclick="startRoutingToSender()">
                <i class="fa-solid fa-navigation"></i> Bắt đầu dẫn đường trực tuyến
            </button>

            <div class="share-box" id="shareBox">
                <div class="status-title">Sao chép liên kết điểm hẹn:</div>
                <div class="input-group">
                    <input type="text" id="share-link" readonly>
                    <button class="btn-copy" onclick="copyLink()">Copy</button>
                </div>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <footer>
        Ứng dụng chia sẻ vị trí &copy; 2026. Phát triển bởi <strong>Minh Fansub PTL</strong>.
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script>
        let map;
        let baseLayers;
        let senderMarker;
        let routeControl;
        
        let senderLat = null;
        let senderLng = null;

        // Khởi tạo hệ thống bản đồ liên kết trực tiếp tới máy chủ Google Maps
        function initSystemMap(lat = 21.0285, lng = 105.8542, zoom = 6) {
            
            // 1. Tầng Bản đồ giao thông/đường sá chuẩn của Google Maps
            const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google Maps'
            });

            // 2. Tầng Địa hình Vệ tinh chân thật đầy đủ chi tiết chữ, số nhà của Google Maps (Hybrid)
            const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google Maps Vệ Tinh'
            });

            map = L.map('map', {
                center: [lat, lng],
                zoom: zoom,
                layers: [googleHybrid], // Đặt mặc định mở lên là thấy ngay Địa hình vệ tinh siêu thực
                zoomControl: false
            });

            L.control.zoom({ position: 'topright' }).addTo(map);

            // Menu chuyển đổi linh hoạt ở góc phải
            baseLayers = {
                "Google Vệ tinh thực tế": googleHybrid,
                "Google Đường sá": googleStreets
            };
            L.control.layers(baseLayers, null, { position: 'topright', collapsed: false }).addTo(map);
        }

        // Thực hiện lấy tọa độ người gửi
        function getMyLocation() {
            const status = document.getElementById('status-text');
            if (!navigator.geolocation) {
                status.innerText = "Trình duyệt không hỗ trợ quét GPS.";
                return;
            }
            status.innerText = "Đang kết nối vệ tinh tìm vị trí của bạn...";

            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                
                status.innerHTML = `<b>Đã tìm thấy bạn!</b><br>Tọa độ chính xác: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                
                map.setView([lat, lng], 17);
                if (senderMarker) map.removeLayer(senderMarker);
                
                senderMarker = L.marker([lat, lng]).addTo(map).bindPopup("Bạn đang ở đây!").openPopup();

                // Tạo URL đính kèm dữ liệu định vị
                const pureUrl = window.location.href.split('?')[0];
                document.getElementById('share-link').value = `${pureUrl}?lat=${lat}&lng=${lng}`;
                document.getElementById('shareBox').style.display = 'block';
            }, () => {
                status.innerText = "Vui lòng cho phép quyền truy cập vị trí trên thiết bị.";
            }, { enableHighAccuracy: true });
        }

        // Tự vẽ tuyến đường từ người xem đến vị trí người gửi ngay trên bản đồ Google thu nhỏ này
        function startRoutingToSender() {
            const status = document.getElementById('status-text');
            status.innerText = "Đang định vị vị trí của bạn để thiết lập đường đi...";

            navigator.geolocation.getCurrentPosition((pos) => {
                const receiverLat = pos.coords.latitude;
                const receiverLng = pos.coords.longitude;

                status.innerHTML = `<b>Đang hiển thị lộ trình!</b><br>Đường kẻ nối từ vị trí hiện tại của bạn đến điểm hẹn.`;

                if (routeControl) {
                    map.removeControl(routeControl);
                }

                // Thực thi bộ vẽ đường tự động bò theo làn giao thông thực tế
                routeControl = L.Routing.control({
                    waypoints: [
                        L.latLng(receiverLat, receiverLng), 
                        L.latLng(senderLat, senderLng)     
                    ],
                    lineOptions: {
                        styles: [{ color: '#1a73e8', opacity: 0.8, weight: 6 }] /* Nét vẽ đường đi màu xanh lam đậm rất bắt mắt */
                    },
                    createMarker: function(i, waypoint, n) {
                        if (i === 0) return L.marker(waypoint.latLng).bindPopup("Vị trí của bạn");
                        return L.marker(waypoint.latLng).bindPopup("Đích đến (Bạn bè)").openPopup();
                    },
                    routeWhileDragging: false,
                    language: 'vi'
                }).addTo(map);

            }, () => {
                status.innerText = "Không thể tìm đường do bạn chưa cấp quyền định vị cho trình duyệt.";
            }, { enableHighAccuracy: true });
        }

        function copyLink() {
            const copyText = document.getElementById("share-link");
            copyText.select();
            document.execCommand("copy");
            alert("Đã sao chép liên kết chia sẻ điểm hẹn thành công!");
        }

        // Khởi chạy phân luồng logic đầu vào của trang web
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const lat = parseFloat(urlParams.get('lat'));
            const lng = parseFloat(urlParams.get('lng'));

            if (!isNaN(lat) && !isNaN(lng)) {
                senderLat = lat;
                senderLng = lng;

                document.getElementById('btn-get').style.display = 'none';
                document.getElementById('btn-route').style.display = 'flex';

                document.getElementById('status-text').innerHTML = `<b>Đã nhận điểm định vị được chia sẻ!</b><br>Mục tiêu: ${lat}, ${lng}. Hãy bấm nút xanh để vẽ đường đi trực tiếp trên bản đồ vệ tinh này.`;

                initSystemMap(senderLat, senderLng, 17);
                senderMarker = L.marker([senderLat, senderLng]).addTo(map).bindPopup("<b>Vị trí người gửi!</b>").openPopup();
            } else {
                initSystemMap();
            }
        }
    </script>
</body>
</html>
